name: Build Flutter Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Create Full Flutter Project Structure & Inject Code
      run: |
        # إنشاء مشروع فلاتر كامل مؤقت بالاسم المطلوب
        flutter create . --org com.socialdownloader --project-name social_downloader_android --platforms android
        
        # التأكد من استبدال الكود الرئيسي بكود الواجهة الخاص بنا
        echo 'import "package:flutter/material.dart";' > lib/main.dart
        echo 'void main() { runApp(const MyApp()); }' >> lib/main.dart
        echo 'class MyApp extends StatelessWidget { const MyApp({super.key}); @override Widget build(BuildContext context) { return MaterialApp( debugShowCheckedModeBanner: false, title: "Social Downloader", theme: ThemeData(primarySwatch: Colors.blue), home: const DownloadScreen(), ); } }' >> lib/main.dart
        echo 'class DownloadScreen extends StatefulWidget { const DownloadScreen({super.key}); @override State<DownloadScreen> createState() => _DownloadScreenState(); }' >> lib/main.dart
        echo 'class _DownloadScreenState extends State<DownloadScreen> { final TextEditingController _urlController = TextEditingController(); String _downloadType = "video"; bool _isDownloading = false; double _progress = 0.0; String _statusText = "جاهز للتحميل..."; void _startDownload() { final url = _urlController.text.trim(); if (url.isEmpty) { ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("يرجى إدخال رابط صحيح!"))); return; } setState(() { _isDownloading = true; _progress = 0.3; _statusText = "جاري الاتصال بالرابط..."; }); Future.delayed(const Duration(seconds: 2), () { setState(() { _progress = 1.0; _statusText = "اكتمل التحميل بنجاح!"; _isDownloading = false; }); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("تم التحميل بنجاح!"))); }); } @override Widget build(BuildContext context) { return Scaffold( appBar: AppBar(title: const Text("برنامج تحميل وسائل التواصل"), centerTitle: true), body: Padding( padding: const EdgeInsets.all(20.0), child: Column( crossAxisAlignment: CrossAxisAlignment.stretch, children: [ const Text("أدخل الرابط (يوتيوب، فيسبوك، انستغرام...):", style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold)), const SizedBox(height: 8), TextField(controller: _urlController, decoration: const InputDecoration(border: OutlineInputBorder(), hintText: "ألصق الرابط هنا...")), const SizedBox(height: 20), const Text("اختر صيغة التحميل:", style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold)), Row( children: [ Expanded(child: RadioListTile<String>(title: const Text("فيديو (MP4)"), value: "video", groupValue: _downloadType, onChanged: (v) => setState(() => _downloadType = v!))), Expanded(child: RadioListTile<String>(title: const Text("صوت (MP3)"), value: "audio", groupValue: _downloadType, onChanged: (v) => setState(() => _downloadType = v!))), ], ), const SizedBox(height: 20), ElevatedButton(style: ElevatedButton.styleFrom(padding: const EdgeInsets.symmetric(vertical: 15), backgroundColor: Colors.blue, foregroundColor: Colors.white), onPressed: _isDownloading ? null : _startDownload, child: const Text("بدء التحميل", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold))), const SizedBox(height: 30), if (_isDownloading || _progress > 0) ...[ LinearProgressIndicator(value: _progress), const SizedBox(height: 10), Text(_statusText, textAlign: TextAlign.center, style: const TextStyle(color: Colors.grey)), ], ], ), ), ); } }' >> lib/main.dart

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
